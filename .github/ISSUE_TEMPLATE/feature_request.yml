name: Feature Request
description: Suggest a new feature or improvement for Valobot.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion!
        Please describe your idea in as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve? Why is it needed?
      placeholder: "e.g. There is no way to balance teams by rank, so games are often uneven."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you would like to see.
      placeholder: "e.g. Add a rank input when joining the queue and use it to balance teams."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any mockups, references, or extra information that would help.
    validations:
      required: false
