name: Bug Report
description: Report a bug or unexpected behaviour in Valobot.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!
        Please fill in as much detail as possible to help us fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g. Pressing the Join button causes no response."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behaviour.
      placeholder: |
        1. Run `/recruit`
        2. Press the **Join** button
        3. Observe that nothing happens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
      placeholder: "e.g. My name should appear in the queue list."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
      placeholder: "e.g. The embed did not update and no ephemeral message appeared."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Bot Version / Commit Hash
      placeholder: "e.g. v0.1.0 or abc1234"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      description: Paste any relevant console output or tracebacks here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information that might be helpful.
    validations:
      required: false
